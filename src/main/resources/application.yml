server:
  port: 8080

spring:
  application:
    name: tester3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tester3000}
    username: ${DB_USER:tester}
    password: ${DB_PASSWORD:tester}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  paths-to-match: /api/v1/regression/**

tester3000:
  message-delay-ms: ${MESSAGE_DELAY_MS:2000}
  parallel-tests: ${PARALLEL_TESTS:2}
  test-start-interval-ms: ${TEST_START_INTERVAL_MS:3000}
  m210:
    base-url: ${M210_BASE_URL:http://127.0.0.1:8080}
    path: /api/1.1.0/prod_auth/_request
    mdm-id: ${M210_MDM_ID:tester3000}
    stub-enabled: ${M210_STUB_ENABLED:true}
  kafka:
    clearing-topic: ccop.prx.event.clearing
    # Отдельный кластер для outbox 25 / 104 / 39 (stub + consumers)
    fin-bootstrap-servers: ${FIN_KAFKA_BOOTSTRAP:localhost:9093}
    fin-outbox-topic: tsss.ccop_incoming_fin_message.outbox
    fin-outbox-group-id: tester3000-fin-outbox
    fin-instruction-topic: tsss.ccop_fin_instruction.outbox
    fin-instruction-group-id: tester3000-fin-instruction
    fin-transaction-topic: tsss.ccop_fin_transaction.outbox
    fin-transaction-group-id: tester3000-fin-transaction
    # Заглушка: по 2 сообщения со случайным статусом в каждый из 3 outbox-топиков
    fin-outbox-stub-enabled: ${FIN_OUTBOX_STUB_ENABLED:true}

logging:
  level:
    ru.vtb.tester3000: INFO
